# Plantilla HTTP inicial. Certbot administrará la copia instalada después de
# emitir el certificado; no se debe sobrescribir durante actualizaciones.
server {
    listen 80;
    listen [::]:80;

    server_name calorias.joserabalsegura.com;

    access_log /var/log/nginx/calorias.access.log;
    error_log /var/log/nginx/calorias.error.log warn;

    client_max_body_size 10m;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        proxy_pass http://127.0.0.1:3090;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
